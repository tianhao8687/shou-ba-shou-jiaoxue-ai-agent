name: Full telemetry validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telemetry-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aiops2025-telemetry:
    name: AIOps2025 frozen multimodal holdout
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Restore verified raw-data cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/external-validation/raw
          key: aiops2025-telemetry-${{ hashFiles('data/external/telemetry-manifest-v4.json') }}

      - name: Install telemetry validation dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Fetch pinned bytes, freeze predictions, then score
        run: >-
          python scripts/run-telemetry-validation.py
          --require-gates
          --predictions "${RUNNER_TEMP}/telemetry-predictions-online.json"
          --output "${RUNNER_TEMP}/telemetry-evidence-online.json"

      - name: Replay from the verified cache without network
        run: >-
          python scripts/run-telemetry-validation.py
          --offline
          --require-gates
          --assert-semantic-equals "${RUNNER_TEMP}/telemetry-predictions-online.json"
          --predictions "${RUNNER_TEMP}/telemetry-predictions-offline.json"
          --output "${RUNNER_TEMP}/telemetry-evidence-offline.json"

      - name: Upload aggregate evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-validation-evidence
          path: |
            ${{ runner.temp }}/telemetry-predictions-online.json
            ${{ runner.temp }}/telemetry-evidence-online.json
            ${{ runner.temp }}/telemetry-predictions-offline.json
            ${{ runner.temp }}/telemetry-evidence-offline.json
          retention-days: 14
