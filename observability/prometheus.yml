global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: harbor-backend
    static_configs:
      - targets: ["backend:8000"]
  - job_name: harbor-workers
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101
        refresh_interval: 5s
  - job_name: harbor-ops-sandbox
    static_configs:
      - targets: ["ops-sandbox:8092"]
  - job_name: harbor-local-model
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8091"]
